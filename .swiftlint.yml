# Tuned to the existing code style: catch real problems, don't fight the house
# conventions (short math names, long explanatory comments, legacy type names).
included:
  - Hardcord Lock App
  - DeviceActivityManager
  - ShieldConfigurationExtension
  - Hardcord Lock AppTests

disabled_rules:
  - identifier_name        # h, m, d, i, a, b are idiomatic in the time/stats math
  - type_name              # Hardcord_Lock_AppApp is Xcode-generated
  - todo
  - nesting

line_length:
  warning: 180
  error: 300
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 1300
  error: 2000

type_body_length:
  warning: 600
  error: 1000

function_body_length:
  warning: 80
  error: 200

cyclomatic_complexity:
  warning: 15
  error: 30

large_tuple:
  warning: 4
  error: 6

trailing_whitespace:
  ignores_empty_lines: true

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_filter_count
  - unused_optional_binding
