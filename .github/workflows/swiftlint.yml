name: SwiftLint

on:
  push:
    branches: [main, "upgrade/**"]
    paths: ["**/*.swift", ".swiftlint.yml", ".github/workflows/swiftlint.yml"]
  pull_request:
    paths: ["**/*.swift", ".swiftlint.yml", ".github/workflows/swiftlint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: command -v swiftlint || brew install swiftlint
      - name: Lint
        # Warnings are annotated on the PR; only errors fail the job.
        run: swiftlint lint --reporter github-actions-logging
